<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2B2A6B"><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"><title>My account | Ank Jyotish</title></head><body>
<div id="chrome-top"></div><main class="wrap" style="padding:28px 0 40px">
<h1 id="hi" style="font-size:2rem">My account</h1><p class="hint" id="sub">Loading</p>
<div class="grid2" style="margin-top:20px">
<div class="card"><p class="hint">Wallet points</p><div class="stat" id="bal">-</div><p class="hint">1 point = &#8377;1</p></div>
<div class="card"><p class="hint">Subscription</p><div class="stat" id="plan" style="font-size:1.6rem">-</div><p class="hint" id="planEnd"></p></div>
<div class="card"><h3>Numerology</h3><p>Name number, Mulank, Bhagyank and year cautions.</p><p style="margin-top:12px"><a class="btn btn-ink" href="numerology.html">Open numerology</a></p></div>
<div class="card dusk"><span class="badge">Coming soon</span><h3>Kundli and reports</h3><p>Create a Kundli and keep your reports here.</p></div>
</div>
<p style="margin-top:24px"><button class="btn btn-line" id="out">Log out</button></p></main><div id="chrome-bottom"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/numerology.js"></script><script src="js/auth.js"></script><script>
renderChrome('acc'); $('#out').onclick=logout; API.bootstrap(d=>d&&applyBranding(d.settings));
if(!API.tok.user()) location.href='login.html';
else API.call('me',{},'user').then(d=>{ $('#hi').textContent='Hello, '+d.user.Name.split(' ')[0]; $('#sub').textContent=d.user.Mobile+'  /  '+d.user.Email;
 $('#bal').textContent=d.wallet.balance; $('#plan').textContent=d.subscription?d.subscription.PlanName||'Active':'No active plan';
 if(d.subscription)$('#planEnd').textContent='Valid until '+new Date(d.subscription.EndDate).toLocaleDateString('en-IN'); }).catch(e=>{toast(e.message,'bad')});
</script></body></html>
