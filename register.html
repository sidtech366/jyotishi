<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2B2A6B"><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"><title>Create account | Ank Jyotish</title></head><body>
<div id="chrome-top"></div><main class="narrow"><div class="panel"><h1>Create your account</h1><p class="hint" style="margin-bottom:18px">One mobile number and one email per account.</p>
<form id="regForm" novalidate class="stack">
<div class="field"><label for="n">Full name</label><input id="n" name="name" autocomplete="name" required maxlength="80"></div>
<div class="field"><label for="m">Mobile (India, +91)</label><input id="m" name="mobile" inputmode="numeric" autocomplete="tel-national" maxlength="10" pattern="[6-9][0-9]{9}" required></div>
<div class="field"><label for="e">Email</label><input id="e" name="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="new-password" minlength="8" required><span class="hint">At least 8 characters.</span></div>
<div class="field"><label for="c">Confirm password</label><input id="c" name="confirmPassword" type="password" autocomplete="new-password" required></div>
<p class="err" id="err" role="alert"></p><button class="btn btn-gold" type="submit">Create account</button></form>
<p style="margin-top:16px">Already registered? <a href="login.html">Log in</a></p></div></main><div id="chrome-bottom"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/numerology.js"></script><script src="js/auth.js"></script><script>renderChrome('acc');bindRegister();API.bootstrap(d=>d&&applyBranding(d.settings));</script></body></html>
