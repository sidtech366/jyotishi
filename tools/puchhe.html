  const fixNote = exact ? '' : `<small style="color:#8a6d4b">🔎 आपका प्रश्न समझा: <b>${esc(nm.split(' •')[0])}</b>${asp.filter(a => ASPN[a]).length ? ' — ' + asp.filter(a => ASPN[a]).map(a => ASPN[a]).join(', ') : ''}</small>\n`;
  const P = [];
  { const al = VNS.find(x => x[0] === id)[1].join(' '), qt = tok(q).filter(w => !al.includes(nrm(w).trim()) && !/व्रत|पूजा/.test(w)), need = Math.max(1, Math.ceil(qt.length / 2));
    const hit = X.faq.map(f => [f, qt.filter(w => hasW(f[0], f[0].toLowerCase(), w)).length]).filter(x => x[1] >= need).sort((a, b) => b[1] - a[1]);
    if (hit.length) { P.push(`❓ <b>${hit[0][0][0]}</b>\n${hit[0][0][1]}`); if (!asp.length) asp.push('faq-done'); } }
  if (asp.includes('faq')) { const f = X.faq.filter(x => ASP[0][1].test(x[0]) || ASP[0][1].test(x[1])); const qm = f.filter(x => [/मासिक|पीरियड|period|माहवारी|mc/i, /सूतक|sutak|पातक/i, /टूट|toot|tut/i, /गर्भवती|pregnant|बीमार|bimar|बुज़ुर्ग/i, /दवा|dawa|medicine/i, /दो दिन|2 din|do din/i].some(r => r.test(q) && r.test(x[0]))); (qm.length ? qm : f.slice(0, 2)).forEach(x => P.push(`❓ <b>${x[0]}</b>\n${x[1]}`)); }
  if (asp.includes('time') || asp.includes('paran') || !asp.length) P.push('<b>⏰ समय व मुहूर्त</b> (' + esc(L.name) + ')\n' + (X.tm ? X.tm.split('\n').map(x => '• ' + x).join('\n') : 'अगले 13 महीनों में तिथि नहीं मिली'));
  if (asp.includes('m') || !asp.length) P.push('<b>🌟 महत्व</b>\n' + X.m);
  if (asp.includes('sam')) P.push('<b>🧺 पूजन सामग्री</b>\n' + X.sam.split(', ').map(x => '• ' + x).join('\n'));
  if (asp.includes('vidhi') || !asp.length) P.push('<b>📿 पूजा विधि</b>\n' + X.vidhi);
  if (asp.includes('katha')) P.push('<b>📖 व्रत कथा</b>\n' + X.katha);
  if (asp.includes('niyam')) P.push('<b>🍃 नियम व खान-पान</b>\n• ' + X.niyam);
  if (asp.includes('mn')) P.push('<b>🕉️ मंत्र</b>\n' + X.mn + '\n(कम से कम 108 बार)');
  if (asp.includes('dan')) P.push('<b>🎁 दान</b>\n' + X.dan);
  if (asp.includes('ud')) P.push('<b>🏁 उद्यापन</b>\n' + (X.ud === '—' ? 'इस व्रत में अलग उद्यापन की परंपरा नहीं — प्रतिवर्ष श्रद्धा से करें।' : X.ud));
  const more = ['सामग्री', 'कथा', 'नियम', 'मंत्र', 'पारण', 'दान'].filter(k => !q.includes(k)).map(k => `<a href="#" data-ask="${esc(nm.split(' •')[0] + ' ' + k)}">${k}</a>`).join('');
  return { h: fixNote + head + '\n\n' + P.join('\n\n'), src: `<div class="src">${more}<a href="../tools/vratnirnay.html?v=${id}">📜 पूरा विवरण</a></div>` };
}
const CHO = ['उद्वेग', 'चल', 'लाभ', 'अमृत', 'काल', 'शुभ', 'रोग'], CGOOD = { 'अमृत': '✅', 'शुभ': '✅', 'लाभ': '✅', 'चल': '🟡', 'उद्वेग': '❌', 'रोग': '❌', 'काल': '❌' };
function chogTxt(I) { const nd = monthC(I.m === 12 && I.d === 31 ? I.y + 1 : I.y, I.m, locP()); const dl = I.set - I.rise, nl = 24 - dl, sD = [0, 3, 6, 2, 5, 1, 4][I.vaar], sN = [5, 1, 4, 0, 3, 6, 2][I.vaar], hr = new Date().getHours() + new Date().getMinutes() / 60;
  const row = (st, len, s0) => [...Array(8).keys()].map(i => { const a = st + i * len / 8, b = a + len / 8, n = CHO[(s0 + i) % 7]; return `${CGOOD[n]} ${n}: ${A.fmtH(a)}–${A.fmtH(b)}${hr >= a && hr < b ? ' ⬅ अभी' : ''}`; }).join('\n');
  return `<b>☀️ दिन का चौघड़िया</b>\n${row(I.rise, dl, sD)}\n\n<b>🌙 रात्रि का चौघड़िया</b>\n${row(I.set, nl, sN)}`; }
function todayAns(q) {
  if (!/आज|अभी|कल\b|aaj|aj\b|abhi|today|kal\b|tomorrow/i.test(q)) return null;
  if (!/तिथि|राहु|सूर्योदय|सूर्यास्त|नक्षत्र|पंचांग|चौघड़िया|योग|करण|चंद्र|राशि|मुहूर्त|अभिजित|भद्रा|पंचक|दिशा|tithi|rahu|sunrise|sunset|nakshatra|panchang|choghadiya|chaughadiya|yog|karan|chandra|rashi|muhurat|abhijit|bhadra|panchak|disha|vrat|व्रत|त्योहार|tyohar|festival/i.test(q)) return null;
  const L = locP(), n = new Date(); if (/कल\b|kal\b|tomorrow/i.test(q)) n.setDate(n.getDate() + 1);
  const y = n.getFullYear(), m = n.getMonth() + 1, d = n.getDate(), I = monthC(y, m, L)[d - 1], N = A.N, tz = L.tz;
  const seg = (I.set - I.rise) / 8, rs = I.rise + (RAHU[I.vaar] - 1) * seg, dm = (I.set - I.rise) / 15, ab = I.rise + 7 * dm;
  const te = A.nextChange(I.jdRise, A.tithiNo, .02), ne = A.nextChange(I.jdRise, A.nakNo, .02);
  const ds = ['पश्चिम', 'पूर्व', 'उत्तर', 'उत्तर', 'दक्षिण', 'पश्चिम', 'पूर्व'][I.vaar];
  const ev = (I.events || []).map(e => e[0] + ' ' + e[1]).join(', ');
  return { h: `<b>🌞 ${d} ${MN[m - 1]} ${y}, ${WD[I.vaar]}</b> (${esc(L.name)})\n\n• तिथि: <b>${A.tithiName(I.tithi)}</b> — ${A.fmtJd(te, tz)} तक\n• नक्षत्र: <b>${N.NAK[A.nakNo(I.jdRise)]}</b> — ${A.fmtJd(ne, tz)} तक\n• मास: ${(I.adhik ? 'अधिक ' : '') + N.MAAS[I.maas]} (अमांत)\n• चंद्र राशि: ${N.SIGN[Math.floor(A.sunMoon(I.jdRise).moon / 30)]}\n• सूर्योदय ${A.fmtH(I.rise)} • सूर्यास्त ${A.fmtH(I.set)}\n• ✨ अभिजित्: ${I.vaar === 3 ? 'बुधवार — वर्जित' : A.fmtH(ab) + '–' + A.fmtH(ab + dm)}\n• ⛔ राहुकाल: ${A.fmtH(rs)}–${A.fmtH(rs + seg)}\n• 🚫 दिशा शूल: ${ds}` + (ev ? `\n\n🙏 <b>व्रत-त्योहार:</b> ${ev}` : ''),
    src: '<div class="src"><a href="../tools/panchang.html">🌞 पूरा पंचांग, चौघड़िया, लग्न</a></div>', I, L };
}
/* ज्ञान भंडार से — केवल प्रश्न से मेल खाते वाक्य (सही उत्तर, ग़लत नहीं) */
function kbAns(q) {
  const R = retrieve(q, 6); if (!R.length) return null;
  const T = [...new Set(tok(q).flatMap(w => [w, SYN[w]].filter(Boolean)))]; if (!T.length) return null;
  const cover = o => T.filter(w => hasW(o.k.x, o.k.l, w, o.k)).length / T.length;
  let G = R.filter(o => cover(o) >= (T.length >= 3 ? 0.6 : 0.99)); if (!G.length) return null;
  G = G.filter((o, i) => i === 0 || (o.s >= G[0].s * 0.8 && cover(o) >= cover(G[0])));
  const out = G.slice(0, 2).map(o => { const S = o.k.x.split(/(?<=[।॥?!])\s+|\n+/).filter(Boolean); const hitS = S.filter(s => T.some(w => hasW(s, s.toLowerCase(), w))); const pick = (hitS.length ? hitS : S).slice(0, 5).join(' ');
    return `<b>📚 ${esc(o.k.t)}</b>\n${esc(pick.length > 700 ? pick.slice(0, 700) + '…' : pick)}`; });
  return { h: out.join('\n\n'), src: srcHtml(G) };
}

const fmtA = t => t.replace(/\n/g, '<br>');
let busy = false;
const PERS = /मेरी|मेरा|मेरे|मुझे|मैं|हमारी|हमारा|meri|mera|mere|mujhe|main\b|hamari|hamara|my\b|mine|कुंडली|kundli|kundali|लग्न|lagna|दशा|dasha|रत्न|ratna|ratn|इष्ट|isht|दोष|dosh|मांगलिक|manglik/i;
function done(w, a, cls) { if (cls) w.classList.add(cls); w.innerHTML = fmtA(a.h) + (a.src || ''); down(); busy = false; $('go').disabled = false; }
async function ask(qq) {
  const q = (qq || $('q').value).trim(); if (!q || busy) return;
  try { AVTRK('search', '🙏 सिद्धांत से प्रश्न: ' + q); } catch (e) { }
  busy = true; $('go').disabled = true; $('q').value = ''; $('q').style.height = 'auto';
  add('u', esc(q)); const w = add('b', '<span class="dots"><i></i><i></i><i></i></span>');
  await new Promise(r => setTimeout(r, 30));
  let a = null;
  try {
    a = vratAns(q);                                          // 1. व्रत-त्योहार (तिथि, मुहूर्त, विधि, कथा…)
    if (!a) { a = todayAns(q); if (a && /चौघड़िया|choghadiya|chaughadiya|choghdiya/i.test(q)) a.h = chogTxt(a.I) + '\n\n' + a.h.split('\n').slice(0, 1).join(''); }   // 2. आज/कल का पंचांग
    if (!a && !KD && /मेरी|मेरा|मेरे|मुझे|meri|mera|mere|mujhe/i.test(q) && /कुंडली|kundli|kundali|लग्न|lagna|दशा|dasha|रत्न|ratna|ratn|इष्ट|isht|दोष|dosh|मांगलिक|manglik/i.test(q)) a = { h: '🪔 आपकी व्यक्तिगत जानकारी (रत्न, दशा, दोष, इष्ट) के लिए पहले अपनी कुंडली बनाएं — फिर मैं उसी से सटीक उत्तर दूँगा।', src: '<div class="src"><a href="../kundli/?embed=1">🪔 कुंडली बनाएं</a></div>' };
    if (!a && PERS.test(q)) { const LA = localAns(q); if (LA) a = { h: LA, src: '<div class="src"><a href="../kundli/?embed=1">🪔 ' + esc(KD.n) + ' की कुंडली से गणना</a></div>' }; }   // 3. अपनी कुंडली
    if (!a) { await kbLoad().catch(() => { }); a = kbAns(q); } // 4. साइट का ज्ञान भंडार (सटीक मेल)
  } catch (e) { a = null; }
  if (a) return done(w, a);
  // 5. AI (यदि चालू) — अधिकतम 12 सेकंड
  w.innerHTML = '<span class="dots"><i></i><i></i><i></i></span> <small>सिद्धांत विचार कर रहे हैं…</small>';
  const R = retrieve(q), kq = useK && KD && PERS.test(q);
  let ctx = ''; const P = panchangCtx(); if (P) ctx += '### ' + P + '\n\n';
  if (kq) ctx += `### यजमान की कुंडली (${KD.n}, ${KD.d} ${KD.t}, ${KD.p || ''}):\n${kSel(q)}\n\n`;
  if (R.length) ctx += '### साइट का ज्ञान भंडार:\n' + R.map(o => `[${o.k.t}] ${o.k.x}`).join('\n\n');
  try {
    const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 12000);
    const r = await fetch(EXEC, { method: 'POST', body: JSON.stringify({ act: 'ask', q, ctx, dev: DEV }), signal: ac.signal }).then(x => x.json()); clearTimeout(tm);
    if (!r.ok) throw new Error(r.error || 'त्रुटि');
    w.innerHTML = esc(r.data.a).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^\s*[\*\-] /gm, '• ') + (r.data.a.includes('उपलब्ध नहीं') ? '' : (kq ? '<div class="src"><a href="../kundli/?embed=1">🪔 आपकी कुंडली</a></div>' : srcHtml(R)));
    $('left').textContent = r.data.left >= 0 ? `आज ${r.data.left} प्रश्न और पूछ सकते हैं` : '';
  } catch (e) {
    w.classList.add('sys');
    w.innerHTML = esc(NOINFO) + '\n\n<small>प्रश्न ऐसे पूछें: “करवा चौथ की पूजा विधि”, “अगली एकादशी का पारण कब है”, “आज राहुकाल”, “मेरी कुंडली के दोष”, “पूजा घर किस दिशा में”</small>';
  }

}
$('go').onclick = () => ask();
