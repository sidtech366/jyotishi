<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>तंत्र साधना | Astro Vikass</title>
<meta name="theme-color" content="#6b1418">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/ui.css">
<style>.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mode button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;font-weight:700;font-size:15px;color:var(--mar);cursor:pointer}
.mode button.on{background:linear-gradient(135deg,var(--mar3),var(--mar));color:#fff;border-color:var(--mar)}
.cats{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.cats .chip{white-space:nowrap}.cats .chip i{font-style:normal;font-size:11.5px;opacity:.8;margin-left:3px}
.sd{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 8px 20px -18px #6b141888}
.sd h3{font-family:'Yatra One','Noto Sans Devanagari',serif;font-weight:400;color:var(--mar);font-size:19px;line-height:1.35}
.sd .tg{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 9px}
.sd .tg span{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:#fff1dc;color:var(--mar3);border:1px solid #f1d3a4}
.mn{background:linear-gradient(135deg,#3d0a0d,#6b1418);color:#ffe7b8;border-radius:14px;padding:14px 12px;text-align:center;font-weight:700;font-size:calc(19px * var(--fs));line-height:1.75;letter-spacing:.2px}
.mn small{display:block;color:#f3c98b;font-weight:500;font-size:12px;margin-top:4px}
.vd{margin-top:10px}.vd b{color:var(--mar);font-size:14.5px}
.vd ol{margin:4px 0 0 20px;font-size:15px}.vd li{margin:3px 0}
.ph{margin-top:9px;background:var(--okbg);color:#125c36;border-radius:12px;padding:8px 11px;font-size:14.5px}
.wr{margin-top:9px;background:var(--badbg);color:#8d2219;border-radius:12px;padding:8px 11px;font-size:13.5px}
.src{margin-top:7px;font-size:12px;color:var(--mut)}
.ac{display:flex;gap:8px;margin-top:11px}.ac .btn{flex:1;padding:9px 8px;font-size:14px}
.soon{text-align:center;padding:26px 12px;color:var(--mut);background:#fff;border:1.5px dashed #e9c98a;border-radius:16px}
.soon b{display:block;font-size:34px}
.fs{display:flex;gap:6px;justify-content:flex-end;margin:-4px 0 8px}.fs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:3px 10px;font-weight:700;color:var(--mar);cursor:pointer}</style>
</head>
<body>
<header class="av-head"><div class="ic">🔱</div><h1>तंत्र साधना</h1><p>मंत्र एवं साधना विधि — विभाग अनुसार</p><span class="brand">ASTRO VIKASS</span></header>
<main class="av-wrap">
<div id="avModeBar" hidden></div>
<div class="mode" id="md"><button data-m="m">📿 केवल मंत्र</button><button data-m="v" class="on">📜 मंत्र + साधना विधि</button></div>
<div class="search"><span>🔍</span><input id="q" placeholder="खोजें — बगलामुखी, सर्प, संतान, vashikaran…"></div>
<div class="chips cats" id="ct"></div>
<div class="fs"><button id="fm">अ−</button><button id="fp">अ+</button></div>
<div id="out"></div>
<div class="note" style="text-align:center">🙏 साधना गुरु-मार्गदर्शन, शुद्धता और श्रद्धा से करें। स्वास्थ्य, गर्भ या जान के खतरे वाले मामलों में मंत्र के साथ डॉक्टर/विशेषज्ञ की सलाह अवश्य लें।</div>
</main>
<div class="foot"><b>Astro Vikass</b> • ☎ 7069492135<br>ज्योतिषीय गणना मार्गदर्शन हेतु है</div>
<script src="lib/places.js"></script>
<script src="lib/astro.js"></script>
<script src="lib/ui.js"></script>
<script>
const { $, esc, store, toast, share } = AVUI;
/* विभाग — नए विभाग यहीं जोड़ें */
const CATS = [
  ['all', '🔱 सभी'],
  ['santan', '👶 संतान एवं गर्भ'],
  ['raksha', '🛡️ रक्षा एवं सर्प'],
  ['vashikaran', '🧲 वशीकरण'],
  ['shakti', '🔥 शक्ति साधना'],
  ['pari', '✨ परी / अप्सरा साधना'],
  ['siddhi', '🕉️ सिद्धि एवं मंत्र जागरण']
];
/* साधनाएं — हर नई साधना एक पंक्ति/वस्तु: cat, t(नाम), dev(देवता), m(मंत्र), v(विधि के चरण), p(फल), w(सावधानी), s(स्रोत) */
const D = [
  { id: 'putra', cat: 'santan', t: 'पुत्र प्राप्ति उपाय — बगलामुखी कवच अभिमंत्रित जल', dev: 'माँ बगलामुखी', tags: ['संतान प्राप्ति', 'कोख बंधन'],
    m: 'श्री बगलामुखी कवच', mNote: '(कवच पाठ से जल अभिमंत्रित करें)',
    v: ['यह प्रयोग उस स्त्री के लिए है जिसकी संतान उत्पत्ति में बाधा हो या जिसकी कोख बांध दी गई हो (कोख बंधन)।',
        'स्नान कर पीले वस्त्र पहनें, माँ बगलामुखी का ध्यान कर हल्दी, पीले पुष्प से पूजन करें।',
        'तांबे/कांसे के पात्र में शुद्ध जल सामने रखें।',
        'बगलामुखी कवच का 3 बार अथवा 11 बार पाठ करते हुए उस जल को अभिमंत्रित करें।',
        'अभिमंत्रित जल उस स्त्री को पिलाएं।',
        'अंत में “बगलामुखी माता की जय” बोलकर प्रणाम करें।'],
    p: 'मान्यता है कि देवी की कृपा से संतान (पुत्र) की प्राप्ति होती है।',
    w: 'संतान में देरी होने पर पति-पत्नी दोनों की डॉक्टरी जाँच भी कराएं — साधना के साथ इलाज जारी रखें।',
    s: 'परंपरागत तंत्र प्रयोग' },
  { id: 'garbhstambhan', cat: 'santan', t: 'गर्भ-स्तम्भन मंत्र', dev: 'गर्भधारिणी देवी', tags: ['गर्भ निरोध', 'स्तम्भन'],
    m: 'ॐ गर्भधारिणी गर्भ स्तम्भनं कुरु कुरु स्वाहा।',
    v: ['तंत्र-नियम के अनुसार जिस वस्तु से प्रयोग करना हो, उसे पहले इस सिद्धि-मंत्र से अभिमंत्रित (प्रभावित) कर लेना चाहिए।',
        'शुभ मुहूर्त में स्नान कर आसन पर बैठें, संकल्प लेकर मंत्र का जप करें।',
        'जप पूर्ण होने पर वस्तु को अभिमंत्रित मानकर प्रयोग करें।'],
    p: 'प्राचीन तंत्राचार्यों के अनुसार यह प्रयोग स्तम्भन (गर्भ न ठहरने) हेतु प्रचलित रहा है।',
    w: 'यह केवल आध्यात्मिक-परंपरागत प्रयोग है, गर्भनिरोध का साधन नहीं। अनचाहे गर्भ से बचाव के लिए डॉक्टर द्वारा बताए उपाय ही अपनाएं। शरीर पर कोई लेप या पदार्थ न लगाएं — संक्रमण का खतरा है।',
    s: 'तंत्र ग्रंथ — गर्भ-स्तम्भन प्रकरण' },
  { id: 'sarp', cat: 'raksha', t: 'सर्प को घड़े में डालने का मंत्र', dev: 'नाग देवता', tags: ['सर्प', 'सांप', 'रक्षा'],
    m: 'ॐ ल ल ल ल ला ला कुरु कुरु स्वाहा',
    v: ['मंत्र को पहले शुभ दिन (नाग पंचमी/ग्रहण काल) में जप कर सिद्ध करें।',
        'आवश्यकता पड़ने पर सर्प से सुरक्षित दूरी पर रहकर, खुला घड़ा रखकर इस मंत्र का जप करें।'],
    p: 'मान्यता है कि इस मंत्र का जप करने मात्र से सर्प घड़े में प्रवेश कर जाता है।',
    w: 'सांप के पास न जाएं, हाथ से न पकड़ें। तुरंत स्नेक रेस्क्यू/वन विभाग को बुलाएं। सांप काटे तो झाड़-फूंक में समय न गंवाएं — तुरंत 108 एंबुलेंस से अस्पताल जाएं।',
    s: 'लोक-परंपरा (सर्प मंत्र)' }
];
let M = store.get('av_tantra_m', 'v'), C = 'all', fs = store.get('av_tantra_fs', 1);
document.documentElement.style.setProperty('--fs', fs);
const cnt = k => k === 'all' ? D.length : D.filter(x => x.cat === k).length;
function cats() { $('ct').innerHTML = CATS.map(([k, n]) => `<span class="chip${k === C ? ' on' : ''}" data-k="${k}">${n}<i>${cnt(k) || 'जल्द'}</i></span>`).join(''); }
const txt = x => x.t + ' ' + x.dev + ' ' + (x.tags || []).join(' ') + ' ' + x.m + ' ' + x.v.join(' ') + ' ' + x.p + ' ' + (CATS.find(c => c[0] === x.cat) || [])[1];
function card(x) {
  const cn = (CATS.find(c => c[0] === x.cat) || [])[1] || '';
  return `<div class="sd" id="s_${x.id}"><h3>${esc(x.t)}</h3><div class="tg"><span>${esc(cn)}</span><span>🙏 ${esc(x.dev)}</span>${(x.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
  <div class="mn">${esc(x.m)}${x.mNote ? `<small>${esc(x.mNote)}</small>` : ''}</div>
  ${M === 'v' ? `<div class="vd"><b>📜 साधना विधि</b><ol>${x.v.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div><div class="ph">✨ <b>फल:</b> ${esc(x.p)}</div>${x.w ? `<div class="wr">⚠️ <b>सावधानी:</b> ${esc(x.w)}</div>` : ''}<div class="src">स्रोत: ${esc(x.s || 'परंपरागत')}</div>` : ''}
  <div class="ac"><button class="btn ln" data-c="${x.id}">📋 मंत्र कॉपी</button><button class="btn" data-w="${x.id}">📤 WhatsApp</button></div></div>`;
}
function render() {
  $('md').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === M));
  cats();
  const q = $('q').value.trim();
  const L = D.filter(x => (C === 'all' || x.cat === C) && (!q || AVQ(txt(x), q)));
  $('out').innerHTML = L.length ? L.map(card).join('') : (q ? '<div class="soon"><b>🔍</b>कुछ नहीं मिला</div>' : `<div class="soon"><b>🪔</b>इस विभाग की साधनाएं जल्द जोड़ी जाएंगी</div>`);
}
$('md').onclick = e => { const b = e.target.closest('button'); if (!b) return; M = b.dataset.m; store.set('av_tantra_m', M); render(); };
$('ct').onclick = e => { const c = e.target.closest('.chip'); if (!c) return; C = c.dataset.k; render(); };
$('q').oninput = render;
const setFs = d => { fs = Math.min(1.5, Math.max(0.85, +(fs + d).toFixed(2))); store.set('av_tantra_fs', fs); document.documentElement.style.setProperty('--fs', fs); };
$('fm').onclick = () => setFs(-0.1); $('fp').onclick = () => setFs(0.1);
$('out').onclick = e => {
  const c = e.target.closest('[data-c]'), w = e.target.closest('[data-w]');
  if (c) { const x = D.find(d => d.id === c.dataset.c); navigator.clipboard.writeText(x.m).then(() => toast('📋 मंत्र कॉपी हो गया'), () => toast('कॉपी नहीं हुआ')); }
  if (w) { const x = D.find(d => d.id === w.dataset.w);
    share(`🔱 *${x.t}*\n🙏 ${x.dev}\n\n📿 *मंत्र:* ${x.m}\n\n📜 *विधि:*\n${x.v.map((s, i) => (i + 1) + '. ' + s).join('\n')}\n\n✨ ${x.p}${x.w ? '\n\n⚠️ ' + x.w : ''}`); }
};
const h = location.hash.slice(1); if (CATS.some(c => c[0] === h)) C = h;
render();
</script>
</body>
</html>
