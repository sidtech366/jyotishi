    ${sec('❤️', 'प्रेम व दांपत्य', X.love, 'love', sc('love'))}
    ${sec('💼', 'करियर व नौकरी', X.career, 'career', sc('career'))}
    ${sec('📈', 'व्यापार', X.career.split('।')[0] + '।', 'biz')}
    ${sec('💰', 'धन', X.money, 'money', sc('money'))}
    ${sec('🌿', 'स्वास्थ्य', X.health, 'health', sc('health'))}
    ${sec('🏠', 'परिवार', X.family)}
    ${sec('🚗', 'यात्रा', X.travel)}
    <div class="grid2" style="margin-top:10px"><div class="box"><small>🎨 शुभ रंग</small><b>${COLOR[dl]}, ${COLOR[lord]}</b></div><div class="box"><small>🔢 शुभ अंक</small><b>${NUM[dl]}, ${NUM[lord] || ''}</b></div><div class="box"><small>🧭 शुभ दिशा</small><b>${DIR[R % 4]}</b></div><div class="box"><small>⏰ शुभ समय (अभिजित्)</small><b>${abh}</b></div></div>
    <div class="grid2" style="margin-top:8px"><div class="box good"><small>✨ आपकी राशि-स्वामी (${N.P[lord]}) की होरा</small><b style="font-size:13.5px">${hl.join(', ') || '—'}</b></div><div class="box bad"><small>⛔ राहुकाल — नया काम न करें</small><b>${fmt(rk)}–${fmt(rk + part)}</b></div></div>
    <div class="note" style="margin-top:4px">समय काशी (वाराणसी) सूर्योदय ${fmt(I.rise)} के अनुसार।</div>
    <h4>🙏 आज का उपाय</h4><p>${vrat}${UPAY[lord]} ${mh === 8 || mh === 12 || mh === 4 ? 'चंद्रमा कमज़ोर है — शिवलिंग पर दूध-जल चढ़ाएँ, सफेद वस्तु दान करें।' : ''}</p>
    <h4>📿 आज का मंत्र</h4><p><b>${MANTRA[lord] || ''}</b> — 108 बार जाप करें। दिन-स्वामी ${N.P[dl]}: <b>${MANTRA[dl]}</b></p>`;
  const shareTxt = `${N.SIGN_IC[R]} *${N.SIGN[R]} राशि — राशिफल* (${A.fmtDate(y, m, d)}, ${N.VAAR[now.getDay()]})\n${MOON[mh]}\n\n👍 ${X.pos.join('; ')}\n👎 ${X.neg.join('; ')}\n❤️ प्रेम: ${X.love}\n💼 करियर: ${X.career}\n💰 धन: ${X.money}\n🌿 स्वास्थ्य: ${X.health}\n🎨 शुभ रंग: ${COLOR[dl]} • 🔢 अंक: ${NUM[dl]} • ⛔ राहुकाल: ${fmt(rk)}–${fmt(rk + part)}\n🙏 उपाय: ${UPAY[lord]}\n📿 मंत्र: ${MANTRA[lord] || ''}\n— Astro Vikass`;
  return { html, shareTxt };
}

const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
$('dt').value = ymd(SEL);
$('dt').onchange = () => { const v = $('dt').value; if (!v) return; const [y, m, d] = v.split('-').map(Number); SEL = new Date(y, m - 1, d, 12); render(); };
$('dPrev').onclick = () => { SEL.setDate(SEL.getDate() - 1); $('dt').value = ymd(SEL); render(); };
$('dNext').onclick = () => { SEL.setDate(SEL.getDate() + 1); $('dt').value = ymd(SEL); render(); };
$('dToday').onclick = () => { SEL = new Date(); $('dt').value = ymd(SEL); render(); };
$('rgrid').innerHTML = N.SIGN.map((s, i) => `<div class="rg" data-i="${i}"><span>${N.SIGN_IC[i]}</span><b>${s}</b></div>`).join('');
$('rgrid').onclick = e => { const el = e.target.closest('.rg'); if (el) pick(+el.dataset.i); };
$('nmGo').onclick = () => { const r = AVAkshar.fromName($('nm').value); if (!r) { $('nmRes').textContent = 'यह अक्षर नहीं मिला — कृपया राशि चुनें'; return; } $('nmRes').textContent = `“${r.s}” अक्षर — ${N.NAK[r.n]} नक्षत्र, चरण ${r.p + 1} → ${N.SIGN[r.sign]} राशि`; pick(r.sign); };
function pick(i) { R = i; store.set('av_rashi', i); document.querySelectorAll('.rg').forEach(el => el.classList.toggle('on', +el.dataset.i === i)); render(); setTimeout(() => $('out').scrollIntoView({ behavior: 'smooth' }), 50); }
const house = (sign) => ((sign - R + 12) % 12) + 1;
const signOf = lon => Math.floor(lon / 30);
function stars(n) { n = Math.max(1, Math.min(5, Math.round(n))); return '★'.repeat(n) + '<span style="opacity:.25">' + '★'.repeat(5 - n) + '</span>'; }
function scoreArea(pos, list) { let s = 0, w = 0; list.forEach(([p, wt]) => { s += (GOOD[p].includes(house(signOf(pos[p]))) ? 1 : -1) * wt; w += wt; }); return 3 + 2 * s / w; }
function noonJd(dt) { return A.jdOf(dt.getFullYear(), dt.getMonth() + 1, dt.getDate(), 6.5); }
function render() {
  if (R == null) { $('out').innerHTML = ''; return; }
  const now = SEL, isToday = now.toDateString() === new Date().toDateString(), pos = A.planets(noonJd(now)), lord = N.LORD[R];
  const head = `<div class="tabs" id="tabs">${[['day', isToday ? 'आज' : 'दिन'], ['week', 'साप्ताहिक'], ['month', 'मासिक'], ['year', 'वार्षिक']].map(([k, t]) => `<button data-k="${k}" class="${tab === k ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  let h = '';
  if (tab === 'day') {
    const r = richDay(now, pos, R, lord);
    h = `<div class="av-card"><h3>${N.SIGN_IC[R]} ${N.SIGN[R]} — ${isToday ? 'आज का' : 'दैनिक'} राशिफल</h3>${r.html}<button class="btn ok share" id="sh">💬 WhatsApp पर भेजें</button></div>`;
    window._share = r.shareTxt;
  } else if (tab === 'week') {
    let rows = '', best = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(now); d.setDate(d.getDate() + i);
      const p = A.planets(noonJd(d)), mh = house(signOf(p.Moon)), g = GOOD.Moon.includes(mh);
      if (g) best.push(N.VAAR[d.getDay()]);
      rows += `<div class="day"><div class="dd">${d.getDate()} ${['जन', 'फर', 'मार्च', 'अप्रै', 'मई', 'जून', 'जुला', 'अग', 'सित', 'अक्टू', 'नव', 'दिस'][d.getMonth()]}<small>${N.VAAR[d.getDay()]}</small></div><div><span class="${g ? 't-good' : mh === 8 ? 't-bad' : 't-mid'}" style="font-weight:700">${g ? 'शुभ' : mh === 8 ? 'सावधान' : 'सामान्य'}</span> — ${MOON[mh]}</div></div>`;
    }
    h = `<div class="av-card"><h3>${N.SIGN_IC[R]} ${N.SIGN[R]} — अगले 7 दिन</h3>${rows}<div class="box good" style="margin-top:10px"><small>इस सप्ताह के सबसे शुभ दिन</small><b>${best.join(', ') || '—'}</b></div></div>`;
  } else if (tab === 'month') {
    const sh = house(signOf(pos.Sun));
    const fast = ['Mars', 'Mercury', 'Venus'].map(p => { const hh = house(signOf(pos[p])), g = GOOD[p].includes(hh); return `<div class="pl"><div class="pi">${N.PIC[p]}</div><div><b>${N.P[p]}</b> ${N.SIGN[signOf(pos[p])]} में (${hh}वां भाव) — <span class="${g ? 't-good' : 't-bad'}">${g ? 'शुभ फल' : 'सावधानी'}</span></div></div>`; }).join('');
    const nxt = A.nextChange(noonJd(now), jd => signOf(A.sunMoon(jd).sun), 1);
    h = `<div class="av-card"><h3>${N.SIGN_IC[R]} ${N.SIGN[R]} — इस माह</h3><div class="note">सूर्य ${N.SIGN[signOf(pos.Sun)]} राशि (${sh}वें भाव) में${nxt ? ' — ' + A.fmtJd(nxt, 5.5) + ' तक' : ''}</div><p style="margin-top:8px;font-size:17px">${SUN[sh]}</p><h4>अन्य ग्रहों का असर</h4>${fast}<h4>🙏 माह का उपाय</h4><p>${UPAY[lord]}</p></div>`;
  } else {
    const jh = house(signOf(pos.Jupiter)), st = house(signOf(pos.Saturn)), rh = house(signOf(pos.Rahu));
    const item = (p, hh, t) => `<div class="pl"><div class="pi">${N.PIC[p]}</div><div><b>${N.P[p]} — ${N.SIGN[signOf(pos[p])]} राशि</b><br>${t}</div></div>`;
    const sade = [12, 1, 2].includes(st) ? 'साढ़ेसाती चल रही है' : st === 4 || st === 8 ? 'शनि ढैय्या चल रही है' : 'साढ़ेसाती/ढैय्या नहीं';
    const good = [JUP[jh], SAT[st], RAHU[rh]].filter(t => t.includes('शुभ')).length;
    h = `<div class="av-card"><h3>${N.SIGN_IC[R]} ${N.SIGN[R]} — वार्षिक राशिफल ${now.getFullYear()}</h3><div class="note">बड़े ग्रहों (गुरु, शनि, राहु) के गोचर के अनुसार</div>
      ${item('Jupiter', jh, JUP[jh])}${item('Saturn', st, SAT[st])}${item('Rahu', rh, RAHU[rh])}
      <div class="grid2" style="margin-top:10px"><div class="box ${[12, 1, 2, 4, 8].includes(st) ? 'bad' : 'good'}"><small>शनि स्थिति</small><b>${sade}</b></div><div class="box ${good >= 2 ? 'good' : good === 0 ? 'bad' : 'mid'}"><small>वर्ष का सार</small><b>${good >= 2 ? 'उन्नति का वर्ष' : good === 0 ? 'धैर्य का वर्ष' : 'मिश्रित वर्ष'}</b></div></div>
      <h4>🙏 वर्ष भर का उपाय</h4><p>${UPAY[lord]} ${[12, 1, 2, 4, 8].includes(st) ? UPAY.Saturn : ''}</p></div>`;
  }
  $('out').innerHTML = head + h;
  $('tabs').onclick = e => { const b = e.target.closest('button'); if (b) { tab = b.dataset.k; render(); } };
  if ($('sh')) $('sh').onclick = () => share(window._share);
}
if (R != null) pick(R);
</script>
</body>
</html>
