function loadJs(src, test) { return test() ? Promise.resolve() : new Promise(ok => { const x = document.createElement('script'); x.src = src; x.onload = ok; x.onerror = ok; document.head.appendChild(x); }); }
async function patCanvas() {
  await loadJs('lib/html2canvas.min.js', () => window.html2canvas);
  if (!window.html2canvas) await loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', () => window.html2canvas);
  if (!window.html2canvas) throw new Error('इमेज टूल लोड नहीं हुआ — इंटरनेट जाँचें');
  try { await document.fonts.ready; } catch (e) { }
  const el = $('pat'), ow = el.style.width;   // कागज़ जैसा चौड़ा रूप (A4 अनुपात) — PDF में कम पन्ने, पढ़ने में बड़ा
  el.style.width = '680px';
  try { return await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false, windowWidth: 720 }); }
  finally { el.style.width = ow; }
}
const fname = ext => ((KIND === 'lagna' ? 'लग्न-पत्रिका-' : 'निमंत्रण-') + (B.name || '') + '-' + (G.name || '')).replace(/[\\/:*?"<>|\s]+/g, '-') + '.' + ext;
const TTL = () => KIND === 'lagna' ? 'लग्न-पत्रिका' : 'विवाह निमंत्रण';
let ACK = 0; window.addEventListener('message', e => { if (e.data && e.data.avFilesOk) ACK = 1; });
async function deliver(files) {
  // Android ऐप ➜ ऐप का अपना सेव/शेयर (सीधे नंबर पर भी); वेबसाइट ➜ मुख्य ऐप की शेयर खिड़की; जवाब न आए तो यहीं
  if (AVUI.hasApp()) { const wn = (($('wn') && $('wn').value) || '').replace(/\D/g, ''); if (wn.length === 10) { S.wn = wn; store.set('av_lp', S); toast('WhatsApp ' + wn + ' खुल रहा है…'); await AVUI.appFile(files[0], 'share', wn, ''); return; } showFile(files[0]); return; }
  if (window.parent !== window) {
    const arr = await Promise.all(files.map(f => new Promise(r => { const fr = new FileReader(); fr.onload = () => r({ name: f.name, type: f.type, data: fr.result }); fr.readAsDataURL(f); })));
    ACK = 0; window.parent.postMessage({ avFiles: 1, title: TTL(), files: arr, phone: ($('wn') && $('wn').value) || '' }, '*');
    await new Promise(z => setTimeout(z, 2500)); if (ACK) return;
  }
  showFile(files[0]);
}
function showFile(f) {   // हर फ़ोन पर काम करने वाला तरीका: इमेज दिखाओ (दबाकर सेव) + डाउनलोड + शेयर
  const url = URL.createObjectURL(f), img = f.type.indexOf('image') === 0, d = document.createElement('div'), APP = AVUI.hasApp(), wn = (($('wn') && $('wn').value) || '').replace(/\D/g, '');
  d.style.cssText = 'position:fixed;inset:0;background:#000e;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;gap:10px;overflow:auto';
  d.innerHTML = (img ? '<img src="' + url + '" style="max-width:100%;max-height:66vh;border-radius:10px;box-shadow:0 8px 30px #0008">' : '<div style="font-size:70px">📄</div>')
    + '<div style="color:#fff;font-size:13.5px;text-align:center;max-width:340px">' + esc(f.name) + ' • ' + Math.round(f.size / 1024) + ' KB' + (img ? '<br>डाउनलोड न हो तो <b>इमेज को दबाकर रखें ➜ “Download / Save image”</b>' : '').replace(/<br>डाउनलोड न हो[^]*$/, APP ? '' : '$&') + '</div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">' + (APP && wn.length === 10 ? '<button class="btn ok" data-a="wn">💬 WhatsApp ' + wn + ' पर भेजें</button>' : '') + '<button class="btn ok" data-a="sh">📤 शेयर</button>' + (APP ? '<button class="btn gold" data-a="sv">⬇️ फ़ोन में सेव</button>' : '<a class="btn gold" data-a="dl" style="text-decoration:none" href="' + url + '" download="' + esc(f.name) + '">⬇️ डाउनलोड</a>') + (img || APP ? '' : '<a class="btn" style="text-decoration:none" href="' + url + '" target="_blank" rel="noopener">👁️ खोलें</a>') + '<button class="btn" data-a="x" style="background:#fff;color:#6b1418;border:0">✖ बंद करें</button></div>';
  d.onclick = async e => { const a = e.target.closest('[data-a]'); if (!a) return; if (a.dataset.a === 'x') d.remove();
    if (APP && a.dataset.a === 'wn') { await AVUI.appFile(f, 'share', wn, ''); return; }
    if (APP && a.dataset.a === 'sh') { await AVUI.appFile(f, 'share', '', ''); return; }
    if (APP && a.dataset.a === 'sv') { await AVUI.appFile(f, 'save'); return; }
    if (a.dataset.a === 'sh') { try { if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: TTL() }); return; } } catch (er) { if (er && er.name === 'AbortError') return; } toast('यहाँ सीधा शेयर नहीं खुलता — ⬇️ डाउनलोड करके WhatsApp में भेजें'); }
    if (a.dataset.a === 'dl') setTimeout(() => toast('डाउनलोड शुरू ✅ — न हो तो ऊपर इमेज दबाकर रखें'), 300); };
  document.body.appendChild(d);
}
async function saveImg() {
  toast('HD इमेज बन रही है…');
  try { const cv = await patCanvas(), b = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.93)); if (!b) throw new Error('इमेज बहुत बड़ी — दोबारा दबाएँ'); await deliver([new File([b], fname('jpg'), { type: 'image/jpeg' })]); }
  catch (e) { toast(e.message || 'इमेज नहीं बन सकी'); }
}
async function makePdf(cv) {   // बिना बाहरी लाइब्रेरी: A4 पन्नों में JPEG
  const W = 595.28, H = 841.89, m = 17, full = cv.height * (W - 2 * m) / cv.width, one = full <= (H - 2 * m) * 1.6;   // थोड़ी लंबी हो तो एक ही पन्ने में फिट
  const pw = one && full > H - 2 * m ? (W - 2 * m) * (H - 2 * m) / full : W - 2 * m, mx = (W - pw) / 2, sliceH = one ? cv.height : Math.floor(cv.width * (H - 2 * m) / pw), pages = [];
  for (let y = 0; y < cv.height; y += sliceH) {
    const c = document.createElement('canvas'); c.width = cv.width; c.height = Math.min(sliceH, cv.height - y);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(cv, 0, y, cv.width, c.height, 0, 0, cv.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9)); pages.push({ w: c.width, h: c.height, d: new Uint8Array(await b.arrayBuffer()) });
  }
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const put = x => { const u = typeof x === 'string' ? enc.encode(x) : x; parts.push(u); len += u.length; };
  const obj = (n, body) => { offs[n] = len; put(n + ' 0 obj\n'); body(); put('\nendobj\n'); };
  put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'); const n = pages.length, kids = pages.map((_, i) => (3 + i * 3) + ' 0 R').join(' ');
  obj(1, () => put('<< /Type /Catalog /Pages 2 0 R >>')); obj(2, () => put(`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`));
  pages.forEach((p, i) => { const po = 3 + i * 3, dh = p.h * pw / p.w, cs = `q ${pw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${mx.toFixed(2)} ${(H - m - dh).toFixed(2)} cm /Im0 Do Q`;
    obj(po, () => put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${po + 2} 0 R >> >> /Contents ${po + 1} 0 R >>`));
    obj(po + 1, () => put(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(po + 2, () => { put(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.d.length} >>\nstream\n`); put(p.d); put('\nendstream'); }); });
  const tot = 3 + n * 3, xo = len; put(`xref\n0 ${tot}\n0000000000 65535 f \n`); for (let i = 1; i < tot; i++) put(String(offs[i]).padStart(10, '0') + ' 00000 n \n');
  put(`trailer\n<< /Size ${tot} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}
async function savePdf() {
  toast('PDF बन रही है…');
  try { const cv = await patCanvas(); await deliver([new File([await makePdf(cv)], fname('pdf'), { type: 'application/pdf' })]); }
  catch (e) { toast(e.message || 'PDF नहीं बन सकी'); }
}
