<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>प्रेम % | Astro Vikass</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

  /* Reset & Body */
  body, html {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    font-family: 'Poppins', sans-serif;
    background: #0f2027;
    background: linear-gradient(to right, #203a43, #2c5364, #0f2027);
    overflow: auto;
  }

  /* Preloader Animation */
  #preloader {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #0f2027; z-index: 9999;
    display: flex; justify-content: center; align-items: center;
    transition: opacity 0.5s ease;
  }
  .heart-loader {
    width: 50px; height: 50px; background: #ff4b5c;
    position: relative; transform: rotate(45deg);
    animation: heartbeat 1.2s infinite;
  }
  .heart-loader:before, .heart-loader:after {
    content: ""; position: absolute; width: 50px; height: 50px;
    background: #ff4b5c; border-radius: 50%;
  }
  .heart-loader:before { top: -25px; left: 0; }
  .heart-loader:after { top: 0; left: -25px; }

  @keyframes heartbeat {
    0% { transform: rotate(45deg) scale(0.8); }
    5% { transform: rotate(45deg) scale(0.9); }
    10% { transform: rotate(45deg) scale(0.8); }
    15% { transform: rotate(45deg) scale(1); }
    50% { transform: rotate(45deg) scale(0.8); }
    100% { transform: rotate(45deg) scale(0.8); }
  }

  /* Full Screen Modal */
  #love-modal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: none; justify-content: center; align-items: center;
    z-index: 999; opacity: 0;
    transition: opacity 0.5s ease;
  }

  /* Glassmorphic Card */
  .glass-card {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    border-radius: 20px;
    padding: 40px 30px; width: 90%; max-width: 400px;
    text-align: center; color: #fff;
    transform: translateY(20px); transition: transform 0.5s ease;
  }
  #love-modal.active { opacity: 1; display: flex; }
  #love-modal.active .glass-card { transform: translateY(0); }

  h2 { margin-top: 0; font-weight: 600; letter-spacing: 1px; color: #ffeb3b; }
  
  .input-group { display: flex; flex-direction: column; gap: 15px; margin: 25px 0; }
  
  input {
    padding: 12px 15px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.05);
    color: #fff; font-size: 16px; outline: none;
    text-align: center; font-family: 'Poppins', sans-serif;
  }
  input::placeholder { color: #ccc; }
  input:focus { background: rgba(255, 255, 255, 0.15); border-color: #ffeb3b; }

  button {
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    border: none; padding: 12px 25px; border-radius: 25px;
    color: white; font-size: 16px; font-weight: 600;
    cursor: pointer; width: 100%; box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  button:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(255, 75, 43, 0.6); }

  /* Results Display */
  #result-area { margin-top: 25px; display: none; min-height: 80px; }
  
  /* Calculating Effect */
  .calculating-text {
    font-size: 16px; color: #ffeb3b; letter-spacing: 2px;
    animation: pulse 1s infinite;
    display: none;
  }
  @keyframes pulse {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
  }

  .final-percentage {
    font-size: 50px; font-weight: 600; color: #00e676;
    margin-top: 5px; text-shadow: 0 0 15px rgba(0, 230, 118, 0.6);
    display: none;
  }
</style>
</head>
<body>

<!-- Preloader -->
<div id="preloader">
  <div class="heart-loader"></div>
</div>

<!-- Modal UI (No Close Button) -->
<div id="love-modal">
  <div class="glass-card">
    <h2>Love Calculator ❤️</h2>
    <p style="font-size: 13px; color: #ddd; margin-bottom: 20px;">Enter names to check compatibility</p>
    
    <div class="input-group">
      <input type="text" id="name1" placeholder="First Name" autocomplete="off" />
      <input type="text" id="name2" placeholder="Second Name" autocomplete="off" onkeydown="if(event.key==='Enter')calculateLove()" />
    </div>
    
    <button onclick="calculateLove()">Calculate</button>
    
    <div id="result-area">
      <div class="calculating-text" id="calc-effect">Scanning Connection...</div>
      <div class="final-percentage" id="final-score"></div>
    </div>
  </div>
</div>

<script>
  window.onload = () => {
    setTimeout(() => {
      document.getElementById('preloader').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('preloader').style.display = 'none';
        let modal = document.getElementById('love-modal');
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('active'), 50);
      }, 500);
    }, 1500);
  };

  function calculateLove() {
    let name1 = document.getElementById('name1').value.toUpperCase().replace(/\s+/g, '');
    let name2 = document.getElementById('name2').value.toUpperCase().replace(/\s+/g, '');
    
    if(!name1 || !name2) {
      let r = document.getElementById('result-area'); r.style.display = 'block';
      document.getElementById('final-score').style.display = 'none';
      let c = document.getElementById('calc-effect'); c.style.display = 'block'; c.textContent = 'Please enter both names!';
      return;
    }

    // Hide result elements initially to reset
    let resArea = document.getElementById('result-area');
    let calcEffect = document.getElementById('calc-effect');
    let finalScoreEl = document.getElementById('final-score');
    
    resArea.style.display = 'block';
    calcEffect.style.display = 'block'; calcEffect.textContent = 'Scanning Connection...';
    finalScoreEl.style.display = 'none';

    // Step 1: Logic Execution (Running in background)
    let combinedStr = name1 + name2;
    let uniqueChars = [...new Set(combinedStr.split(''))];
    
    let commonCounts = [];
    let uncommonCounts = [];

    uniqueChars.forEach(char => {
      let count1 = name1.split(char).length - 1;
      let count2 = name2.split(char).length - 1;
      let total = count1 + count2;

      if(count1 > 0 && count2 > 0) {
        commonCounts.push(total);
      } else {
        uncommonCounts.push(total);
      }
    });

    let sequence = [...commonCounts, ...uncommonCounts];
    
    // Array reduction logic (Hidden from UI)
    while (sequence.length > 2) {
      let tempSeq = [];
      let left = 0;
      let right = sequence.length - 1;

      while (left <= right) {
        if (left === right) {
          tempSeq.push(sequence[left]);
        } else {
          tempSeq.push(sequence[left] + sequence[right]);
        }
        left++;
        right--;
      }

      let splitSeq = [];
      tempSeq.forEach(num => {
        let strNum = num.toString();
        for(let ch of strNum) {
          splitSeq.push(parseInt(ch));
        }
      });
      sequence = splitSeq;
    }

    let percentage = sequence.join('');

    // Wait for 1.5 seconds to show "Calculating..." effect
    setTimeout(() => {
      calcEffect.style.display = 'none';
      finalScoreEl.style.display = 'block';
      finalScoreEl.innerHTML = `0%`;
      
      // Percentage Counter Animation
      let count = 0;
      let target = parseInt(percentage);
      
      // Safe fallback if target is somehow NaN
      if(isNaN(target)) target = 0;

      let interval = setInterval(() => {
        if(count >= target) {
          clearInterval(interval);
          finalScoreEl.innerHTML = `${target}%`;
        } else {
          count++;
          finalScoreEl.innerHTML = `${count}%`;
        }
      }, 25); // Speed of the counter

    }, 1500); // 1.5s Fake calculation delay
  }
</script>

</body>
</html>
