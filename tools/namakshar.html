<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>नामाक्षर एवं नामकरण | Astro Vikass</title>
<meta name="theme-color" content="#6b1418">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/ui.css">
<style>.ak{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.ak div{background:#fff;border:1.5px solid var(--line);border-radius:14px;text-align:center;padding:10px 4px}
.ak div.on{background:var(--mar);border-color:var(--mar);color:#fff}
.ak b{font-size:26px;display:block;line-height:1.2}.ak small{font-size:11.5px;opacity:.8}
.names{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.names span{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:600}</style>
</head>
<body>
<header class="av-head"><div class="ic">👶</div><h1>नामाक्षर एवं नामकरण</h1><p>जन्म नक्षत्र से शुभ अक्षर, राशि और नाम सुझाव</p><span class="brand">ASTRO VIKASS</span></header>
<main class="av-wrap">
<div class="av-card">
  <div class="tabs" id="mode"><button data-m="b" class="on">जन्म विवरण से</button><button data-m="n">नक्षत्र चुनें</button></div>
  <div id="fb"><div id="bf"></div></div>
  <div id="fn" style="display:none"><label class="l">नक्षत्र-चरण</label><select class="in" id="nk"></select></div>
  <button class="btn blk" id="go">👶 शुभ अक्षर देखें</button>
</div>
<div id="out"></div>
</main>
<div class="foot"><b>Astro Vikass</b> • ☎ 7069492135<br>ज्योतिषीय गणना मार्गदर्शन हेतु है</div>
<script src="lib/places.js"></script>
<script src="lib/astro.js"></script>
<script src="lib/ui.js"></script>
<script src="lib/akshar.js"></script>
<script>
const { $, esc, share } = AVUI, A = AVAstro, N = A.N, S = AVAkshar.SYL;
const bf = AVUI.birthForm($('bf'), 'av_baby', '');
let mode = 'b';
$('nk').innerHTML = N.NAK.map((n, i) => [0, 1, 2, 3].map(p => `<option value="${i * 4 + p}">${n} — चरण ${p + 1} (${S[i][p]})</option>`).join('')).join('');
$('mode').onclick = e => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.m; [...$('mode').children].forEach(x => x.classList.toggle('on', x === b)); $('fb').style.display = mode === 'b' ? '' : 'none'; $('fn').style.display = mode === 'n' ? '' : 'none'; };
const NAMES = {
  'च': [['चेतन', 'चिराग', 'चंद्रेश', 'चैतन्य', 'चंदन', 'चक्रधर'], ['चंचल', 'चेतना', 'चांदनी', 'चित्रा', 'चारु', 'चंद्रिका']],
  'ल': [['लक्ष्य', 'लोकेश', 'ललित', 'लव', 'लखन', 'लीलाधर'], ['लता', 'लीना', 'लक्ष्मी', 'लावण्या', 'लतिका', 'लोपा']],
  'अ': [['अमित', 'अर्जुन', 'अंश', 'अभय', 'आदित्य', 'अनिकेत'], ['अनन्या', 'अदिति', 'अंजलि', 'आराध्या', 'अर्पिता', 'अवनी']],
  'ई': [['ईशान', 'ईश्वर', 'इंद्र', 'इंद्रजीत', 'ईशांत', 'इंदर'], ['ईशा', 'इशिता', 'इंदु', 'इला', 'ईशानी', 'इरा']],
  'उ': [['उदय', 'उत्कर्ष', 'उमेश', 'उज्ज्वल', 'उपेंद्र', 'उत्तम'], ['उमा', 'उर्मिला', 'उन्नति', 'उषा', 'उर्वी', 'उज्ज्वला']],
  'ए': [['एकांश', 'एकलव्य', 'एकनाथ', 'एकाक्ष', 'एकदंत', 'ऐश्वर्य'], ['एकता', 'ऐश्वर्या', 'एषा', 'एलिना', 'एकांशी', 'ऐशानी']],
  'ओ': [['ओम', 'ओजस', 'ओंकार', 'ओमप्रकाश', 'ओजस्वी', 'ओमेश'], ['ओजस्विनी', 'ओविया', 'ओमी', 'ओशिन', 'ओजल', 'ओमिशा']],
  'व': [['विवेक', 'विकास', 'वरुण', 'विनय', 'वेद', 'वैभव'], ['वैष्णवी', 'वंदना', 'विधि', 'वाणी', 'वर्षा', 'वेदिका']],
  'क': [['कृष्णा', 'करण', 'कुणाल', 'कार्तिक', 'केशव', 'कौशल'], ['काव्या', 'कीर्ति', 'कुसुम', 'कविता', 'केतकी', 'कोमल']],
  'घ': [['घनश्याम', 'घनेंद्र', 'घटोत्कच', 'घनानंद', 'घोष', 'घनराज'], ['घनिष्ठा', 'घटना', 'घृता', 'घनप्रिया', 'घोषा', 'घनाली']],
  'छ': [['छत्रपाल', 'छत्रसाल', 'छविनाथ', 'छैलबिहारी', 'छत्रेश', 'छविराज'], ['छवि', 'छाया', 'छाया', 'छवि', 'छवीली', 'छाया']],
  'ह': [['हर्ष', 'हिमांशु', 'हेमंत', 'हरीश', 'हार्दिक', 'होमेश'], ['हर्षिता', 'हेमा', 'हिना', 'हीरल', 'हंसिका', 'हिमानी']],
  'ड': [['डमरू', 'डिंपल', 'डुंगर', 'डमरूधर', 'डोलन', 'डालचंद'], ['डिंपल', 'डोली', 'डिंकी', 'डेज़ी', 'डॉली', 'डिंपी']],
  'म': [['मोहन', 'मयंक', 'मनीष', 'मुकेश', 'मेघ', 'माधव'], ['मीरा', 'मानसी', 'मेघा', 'मोनिका', 'माया', 'मुस्कान']],
  'ट': [['टीकाराम', 'टुनटुन', 'टेकचंद', 'टोडरमल', 'टीकम', 'टहलराम'], ['टीना', 'टीनू', 'टिया', 'टुकटुक', 'टीशा', 'टविशी']],
  'प': [['प्रशांत', 'पवन', 'पीयूष', 'पुनीत', 'प्रकाश', 'पंकज'], ['पूजा', 'प्रिया', 'पायल', 'पल्लवी', 'पूर्वी', 'प्रियंका']],
  'ष': [['षडानन', 'षण्मुख', 'षष्ठीदत्त', 'षडक्षर', 'षटपद', 'षष्ठीनाथ'], ['षष्ठी', 'षोडशी', 'षड्जा', 'षण्मुखी', 'षष्ठिका', 'षोडशिका']],
  'ठ': [['ठाकुर', 'ठकुरदास', 'ठाकरसी', 'ठेकेदार', 'ठाकुरप्रसाद', 'ठाणेश'], ['ठकुराइन', 'ठुमरी', 'ठाकुरानी', 'ठुमकी', 'ठिठोली', 'ठुमरा']],
  'र': [['राहुल', 'रोहित', 'राजेश', 'रवि', 'रुद्र', 'रितेश'], ['रिया', 'राधा', 'रूपा', 'रेखा', 'रोशनी', 'रीना']],
  'त': [['तरुण', 'तुषार', 'तेजस', 'तोषित', 'तनय', 'तीर्थ'], ['तनुजा', 'तृप्ति', 'तारा', 'तुलसी', 'तेजस्विनी', 'तोषिका']],
  'न': [['नमन', 'नितिन', 'नवीन', 'नीरज', 'नरेश', 'नूतन'], ['नेहा', 'निधि', 'नंदिनी', 'नूपुर', 'नीलम', 'नैना']],
  'य': [['यश', 'योगेश', 'युवराज', 'यतीन', 'यज्ञेश', 'युग'], ['यशिका', 'योगिता', 'यामिनी', 'युक्ति', 'यशस्वी', 'यशोदा']],
  'भ': [['भरत', 'भावेश', 'भूपेंद्र', 'भास्कर', 'भीम', 'भोलानाथ'], ['भावना', 'भूमि', 'भारती', 'भव्या', 'भैरवी', 'भाग्यश्री']],
  'ध': [['धीरज', 'धर्मेंद्र', 'ध्रुव', 'धनंजय', 'धवल', 'धीरेन'], ['धरा', 'धृति', 'धन्या', 'धनश्री', 'धारा', 'ध्वनि']],
  'फ': [['फणींद्र', 'फतेह', 'फूलचंद', 'फाल्गुन', 'फणीश', 'फलित'], ['फाल्गुनी', 'फूलवती', 'फलक', 'फ्लोरा', 'फूलमती', 'फणिका']],
  'ढ': [['ढोलन', 'ढुंढिराज', 'ढालचंद', 'ढुंढी', 'ढोलेश', 'ढाकेश'], ['ढोला', 'ढुंढा', 'ढलकी', 'ढोलकी', 'ढानी', 'ढुंढिका']],
  'ज': [['जय', 'जितेंद्र', 'जीवन', 'जगदीश', 'जतिन', 'जयेश'], ['जया', 'जानकी', 'जूही', 'ज्योति', 'जागृति', 'जिया']],
  'ख': [['खुशाल', 'खेमचंद', 'खगेश', 'खुशवंत', 'खेलेश', 'खिलेश'], ['खुशी', 'खुशबू', 'ख्याति', 'खेमा', 'खनक', 'खिलखिला']],
  'ग': [['गौरव', 'गोविंद', 'गणेश', 'गिरीश', 'गुरुदत्त', 'गोपाल'], ['गीता', 'गायत्री', 'गुंजन', 'गौरी', 'गरिमा', 'गोपिका']],
  'स': [['सौरभ', 'सागर', 'सिद्धार्थ', 'सुमित', 'सोहन', 'सत्यम'], ['सीता', 'सोनम', 'स्वाति', 'सुमन', 'साक्षी', 'सोनल']],
  'द': [['दीपक', 'देवेंद्र', 'दिनेश', 'दुष्यंत', 'दर्शन', 'दक्ष'], ['दीपिका', 'दिव्या', 'देविका', 'दुर्गा', 'दामिनी', 'दक्षा']],
  'थ': [['थानेश', 'थावरचंद', 'थिरेश', 'थम्मन', 'थानसिंह', 'थलेश'], ['थाली', 'थनवी', 'थिया', 'थारा', 'थिरा', 'थनु']],
  'झ': [['झंकार', 'झलकेश', 'झुमरलाल', 'झनक', 'झीलेश', 'झरनेश'], ['झरना', 'झलक', 'झील', 'झनकार', 'झुमकी', 'झिलमिल']],
};
const ALT = { 'ण': 'न', 'ङ': 'ग', 'ञ': 'ज' };
function namesFor(s) { const c = ALT[s[0]] || s[0], L = NAMES[c] || [[], []]; const sort = a => [...new Set(a)].sort((x, y) => (y.startsWith(s) ? 1 : 0) - (x.startsWith(s) ? 1 : 0)); return [sort(L[0]), sort(L[1])]; }
$('go').onclick = () => {
  let n, p, extra = '';
  if (mode === 'b') { const f = bf.get(); if (!f) return; const lon = A.planets(f.jd).Moon; n = Math.floor(lon / (360 / 27)); p = Math.floor((lon % (360 / 27)) / (360 / 108)); extra = `${esc(f.name || 'शिशु')} — जन्म ${f.date} ${f.time}`; }
  else { const v = +$('nk').value; n = Math.floor(v / 4); p = v % 4; }
  const s = S[n][p], sign = AVAkshar.signOf(n, p), [b, g] = namesFor(s);
  $('out').innerHTML = `<div class="av-card"><h3>शुभ नामाक्षर: “${s}”</h3>${extra ? `<div class="note">${extra}</div>` : ''}
    <div class="grid2" style="margin-top:10px"><div class="box"><small>जन्म नक्षत्र</small><b>${N.NAK[n]} — चरण ${p + 1}</b></div><div class="box"><small>जन्म राशि (चंद्र)</small><b>${N.SIGN_IC[sign]} ${N.SIGN[sign]}</b></div><div class="box"><small>नक्षत्र स्वामी</small><b>${N.P[N.NAK_LORD[n % 9]]}</b></div><div class="box"><small>राशि स्वामी</small><b>${N.P[N.LORD[sign]]}</b></div></div>
    <h4>${N.NAK[n]} नक्षत्र के चारों अक्षर</h4><div class="ak">${S[n].map((x, i) => `<div class="${i === p ? 'on' : ''}"><b>${x}</b><small>चरण ${i + 1}</small></div>`).join('')}</div>
    <h4>👦 लड़के के नाम</h4><div class="names">${b.map(x => `<span>${x}</span>`).join('')}</div>
    <h4>👧 लड़की के नाम</h4><div class="names">${g.map(x => `<span>${x}</span>`).join('')}</div>
    <p class="note">परंपरा में नाम जन्म-चरण के अक्षर (“${s}”) से रखा जाता है। ऊपर “${s}” अक्षर वाले नाम पहले दिखाए गए हैं; बाकी उसी वर्ण के मिलते-जुलते नाम हैं${ALT[s[0]] ? ` (“${s[0]}” से नाम कम बनते हैं, इसलिए “${ALT[s[0]]}” वाले नाम दिए गए हैं)` : ''}। विशेष नामकरण मुहूर्त के लिए संपर्क करें।</p>
    <button class="btn ok share" id="sh">💬 WhatsApp पर भेजें</button></div>`;
  $('sh').onclick = () => share(`👶 *नामाक्षर*\nनक्षत्र: ${N.NAK[n]} (चरण ${p + 1})\nराशि: ${N.SIGN[sign]}\nशुभ अक्षर: *${s}*\nसुझाव: ${b.slice(0, 3).join(', ')} / ${g.slice(0, 3).join(', ')}`);
  $('out').scrollIntoView({ behavior: 'smooth' });
};
</script>
</body>
</html>
