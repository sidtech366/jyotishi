<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>साढ़ेसाती एवं ढैय्या | Astro Vikass</title>
<meta name="theme-color" content="#6b1418">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/ui.css">
<style>.rsel{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.rsel button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:7px 2px;font-weight:700;color:var(--mar);cursor:pointer;font-size:14px}
.rsel button.on{background:var(--mar);color:#fff;border-color:var(--mar)}
.tl{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tl:last-child{border:0}.tl .k{flex:0 0 8px;border-radius:8px}
.tl.now{background:#fff1dc;border-radius:12px;padding:10px}</style>
</head>
<body>
<header class="av-head"><div class="ic">🪐</div><h1>साढ़ेसाती एवं ढैय्या</h1><p>शनि की साढ़ेसाती व ढैय्या — कब से कब तक, पूरी जीवन टाइमलाइन</p><span class="brand">ASTRO VIKASS</span></header>
<main class="av-wrap">
<div class="av-card">
  <div class="tabs" id="mode"><button data-m="r" class="on">राशि से</button><button data-m="b">जन्म विवरण से</button></div>
  <div id="fr"><div class="rsel" id="rsel"></div><label class="l">या नाम लिखें</label><input class="in" id="nm" placeholder="जैसे: राहुल"></div>
  <div id="fb" style="display:none"><div id="bf"></div><button class="btn blk" id="go">🪐 जाँचें</button></div>
</div>
<div id="out"></div>
</main>
<div class="foot"><b>Astro Vikass</b> • ☎ 7069492135<br>ज्योतिषीय गणना मार्गदर्शन हेतु है</div>
<script src="lib/places.js"></script>
<script src="lib/astro.js"></script>
<script src="lib/ui.js"></script>
<script src="lib/akshar.js"></script>
<script>
const { $, esc, store, share } = AVUI, A = AVAstro, N = A.N;
const bf = AVUI.birthForm($('bf'), 'av_self', '');
let R = store.get('av_rashi', null);
$('rsel').innerHTML = N.SIGN.map((s, i) => `<button data-i="${i}">${N.SIGN_IC[i]} ${s}</button>`).join('');
$('rsel').onclick = e => { const b = e.target.closest('button'); if (b) run(+b.dataset.i); };
$('nm').addEventListener('change', () => { const r = AVAkshar.fromName($('nm').value); if (r) run(r.sign); });
$('mode').onclick = e => { const b = e.target.closest('button'); if (!b) return; [...$('mode').children].forEach(x => x.classList.toggle('on', x === b)); $('fr').style.display = b.dataset.m === 'r' ? '' : 'none'; $('fb').style.display = b.dataset.m === 'b' ? '' : 'none'; };
$('go').onclick = () => { const f = bf.get(); if (!f) return; run(Math.floor(A.planets(f.jd).Moon / 30)); };
const satSign = jd => Math.floor(A.planets(jd).Saturn / 30);
let CACHE = null;
function satTimeline() {   // 1950-2080 तक शनि के राशि परिवर्तन (कैश)
  if (CACHE) return CACHE;
  const out = []; let jd = A.jdOf(1950, 1, 1, 0), s = satSign(jd), end = A.jdOf(2080, 1, 1, 0);
  out.push({ jd, s });
  while (jd < end) { let n = jd + 10; while (n < end && satSign(n) === s) n += 10; if (n >= end) break; let lo = n - 10, hi = n; for (let k = 0; k < 25; k++) { const m = (lo + hi) / 2; if (satSign(m) === s) lo = m; else hi = m; } jd = hi; s = satSign(jd + 0.01); out.push({ jd, s }); }
  return CACHE = out;
}
function periods(R) {
  const tl = satTimeline(), res = [];
  const kind = s => { const h = ((s - R + 12) % 12) + 1; return h === 12 || h === 1 || h === 2 ? 'sade' : h === 4 ? 'k' : h === 8 ? 'a' : null; };
  for (let i = 0; i < tl.length; i++) {
    const k = kind(tl[i].s); if (!k) continue;
    const st = tl[i].jd, en = (tl[i + 1] || { jd: A.jdOf(2080, 1, 1, 0) }).jd, last = res[res.length - 1];
    if (last && last.k === k && st - last.end < 400) { last.end = en; if (k === 'sade') last.parts.push({ s: tl[i].s, st, en }); }
    else res.push({ k, start: st, end: en, parts: k === 'sade' ? [{ s: tl[i].s, st, en }] : [] });
  }
  return res;
}
function grp(parts) { const g = []; parts.forEach(x => { const l = g.find(y => y.s === x.s); if (l) { l.en = Math.max(l.en, x.en); l.st = Math.min(l.st, x.st); } else g.push({ ...x }); }); return g.map(x => `${N.SIGN[x.s]} ${yr(x.st)}–${yr(x.en)}`).join(' → '); }
const yr = jd => A.localOf(jd, 5.5).y, dt = jd => A.fmtJd(jd, 5.5).split(',')[0];
function run(r) {
  R = r; store.set('av_rashi', r); [...$('rsel').children].forEach(b => b.classList.toggle('on', +b.dataset.i === r));
  $('out').innerHTML = '<div class="av-card empty">गणना हो रही है…</div>';
  setTimeout(() => {
    const now = A.jdFromDate(new Date()), ps = periods(r), cur = ps.find(p => p.start <= now && p.end > now), next = ps.find(p => p.start > now && p.k === 'sade');
    const NM = { sade: 'साढ़ेसाती', k: 'कंटक (चतुर्थ) ढैय्या', a: 'अष्टम ढैय्या' }, COL = { sade: '#b83227', k: '#c27c0e', a: '#c27c0e' };
    const phase = s => { const h = ((s - r + 12) % 12) + 1; return h === 12 ? 'पहला चरण (उदय) — खर्च, नींद व चिंता' : h === 1 ? 'दूसरा चरण (चरम) — मानसिक दबाव, स्वास्थ्य, धैर्य की परीक्षा' : 'तीसरा चरण (अस्त) — धन-परिवार में संघर्ष, धीरे-धीरे राहत'; };
    let h = `<div class="av-card"><h3>${N.SIGN_IC[r]} ${N.SIGN[r]} राशि</h3><div class="note">इस समय शनि ${N.SIGN[satSign(now)]} राशि में हैं</div>`;
    if (cur) {
      const part = cur.parts && cur.parts.find(x => x.st <= now && x.en > now);
      h += `<div class="box bad" style="margin-top:10px"><small>अभी चल रही है</small><b>${NM[cur.k]}</b><div>${dt(cur.start)} से ${dt(cur.end)} तक</div>${part ? `<div style="margin-top:4px">➡️ ${phase(part.s)}</div>` : ''}</div>`;
    } else h += `<div class="box good" style="margin-top:10px"><b>✅ अभी साढ़ेसाती या ढैय्या नहीं चल रही</b></div>`;
    if (next) h += `<div class="box mid" style="margin-top:8px"><small>अगली साढ़ेसाती</small><b>${dt(next.start)} — ${dt(next.end)}</b></div>`;
    h += `<h4>🙏 शनि शांति के उपाय</h4><p>• शनिवार को पीपल के नीचे सरसों तेल का दीपक जलाएं<br>• हनुमान चालीसा व "ॐ शं शनैश्चराय नमः" का 108 बार जाप<br>• काले तिल, उड़द, लोहा या कंबल का दान<br>• बुजुर्गों, मजदूरों व जरूरतमंदों की सेवा; झूठ और नशे से दूर रहें</p></div>`;
    h += `<div class="av-card"><h3>🗓️ जीवन टाइमलाइन (1950–2080)</h3>${ps.filter(p => yr(p.end) >= 1950).map(p => `<div class="tl ${p === cur ? 'now' : ''}"><div class="k" style="background:${COL[p.k]}"></div><div><b>${NM[p.k]}</b>${p === cur ? ' <span class="t-bad">(अभी)</span>' : ''}<br>${dt(p.start)} → ${dt(p.end)}${p.parts.length > 1 ? `<br><small class="note">${grp(p.parts)}</small>` : ''}</div></div>`).join('')}
      <p class="note">वक्री शनि के कारण कभी-कभी साढ़ेसाती बीच में थोड़े समय के लिए रुककर फिर आती है — ऊपर की तारीखें उसे जोड़कर दिखाती हैं।</p><button class="btn ok share" id="sh">💬 WhatsApp पर भेजें</button></div>`;
    $('out').innerHTML = h;
    $('sh').onclick = () => share(`🪐 *${N.SIGN[r]} राशि — साढ़ेसाती/ढैय्या*\n${cur ? 'अभी: ' + NM[cur.k] + ' (' + dt(cur.start) + ' – ' + dt(cur.end) + ')' : 'अभी साढ़ेसाती/ढैय्या नहीं'}${next ? '\nअगली साढ़ेसाती: ' + dt(next.start) + ' – ' + dt(next.end) : ''}`);
  }, 30);
}
if (R != null) run(R);
</script>
</body>
</html>
